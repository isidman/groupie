<!--
index.html
Αρχική σελίδα της εφαρμογής.
Εμφανίζει όλους τους καλλιτέχνες σε μορφή λίστας ή καρτών.
Κάθε καλλιτέχνης οδηγεί στη σελίδα λεπτομερειών του.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Groupie Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="container site-header">
    <h1>Groupie Tracker</h1>
    <p>Artists List</p>
    <div class="search-row">
      <button id="search-btn" class="filter-btn">🔍</button>
      <div class="search-wrap" id="search-wrap">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search artists, members, locations..."
          autocomplete="off"
        />
      <div id="search-suggestions" class="search-suggestions"></div>
    </div>
    <button id="filter-btn" class="filter-btn">⚡</button>
    </div>
  </header>

  <main class="container grid">
    {{range .}}
      <a class="card" href="/artist?id={{.ID}}">
        <img class="thumb" src="{{.Image}}" alt="{{.Name}}" />
        <div class="card-body">
          <h2>{{.Name}}</h2>
          <p><b>Year:</b> {{.CreationDate}}</p>
          <p><b>Members:</b> {{len .Members}}</p>
        </div>
      </a>
    {{end}}
  </main>
  <div id="filter-modal" class="filter-modal">
    <div class="filter-panel">
      <div class="filter-panel-header">
        <h2>Filter Artists</h2>
        <button id="filter-close" class="filter-close">x</button>
      </div>

      <div class="filter-body">
        <div class="filter-section">
          <label>Creation Year</label>
          <div class="range-inputs">
            <input type="number" id="creationMin" placeholder="From" min="1900" max="2030" />
            <span>-</span>
            <input type="number" id="creationMax" placeholder="To" min="1900" max="2030" />
          </div>
        </div>

        <div class="filter-section">
          <label>First Album Year</label>
          <div class="range-inputs">
            <input type="number" id="albumMin" placeholder="From" min="1900" max="2030" />
            <span>-</span>
            <input type="number" id="albumMax" placeholder="To" min="1900" max="2030" />
          </div>
        </div>

        <div class="filter-section">
          <label>Members</label>
          <div class="checkbox-group" id="members-checkboxes">
            <label><input type="checkbox" value="1" /> 1</label>
            <label><input type="checkbox" value="2" /> 2</label>
            <label><input type="checkbox" value="3" /> 3</label>
            <label><input type="checkbox" value="4" /> 4</label>
            <label><input type="checkbox" value="5" /> 5</label>
            <label><input type="checkbox" value="6" /> 6</label>
            <label><input type="checkbox" value="7" /> 7+</label>
          </div>
        </div>

        <div class="filter-section">
          <label>Location</label>
          <input type="text" id="filter-location" placeholder="e.g. vancouver-canada" />
        </div>

        <div class="filter-results" id="filter-results">
          <p class="filter-hint">Set filters to see results.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
